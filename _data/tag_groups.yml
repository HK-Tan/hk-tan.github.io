# Filter chips on /research/, in display order.
# id: used in the URL, e.g. /research/#ai-safety
# tip: shown on hover
chips:
  - id: interpretability
    label: Interpretability
    tip: Mechanistic interpretability of LLMs
  - id: ai-safety
    label: AI Safety
    tip: Alignment, sandbagging, steering
  - id: llms-agents
    label: LLMs & Agents
    tip: Large language models and multi-agent systems
  - id: causality
    label: Causality
    tip: Causal inference and causal machine learning
  - id: statistics
    label: Statistics
    tip: Mathematical, Bayesian and time-series statistics
  - id: analysis
    label: Analysis & PDEs
    tip: PDEs, functional analysis, ODEs and dynamical systems
  - id: geometry
    label: Geometry & Topology
    tip: Differential topology and differential geometry
  - id: numerics
    label: Numerical Analysis
  - id: physics
    label: Physics
    tip: General relativity, quantum mechanics, astrophysics, fluids

# Detailed tag (as written under a paper in publications.yml) -> chip id.
# A detailed tag not listed here is still shown under the paper, it just has no chip.
tag_to_chip:
  Interpretability: interpretability
  AI Safety: ai-safety
  LLMs: llms-agents
  Multi-agent Systems: llms-agents
  Causality: causality
  Causal Machine Learning: causality
  Statistics: statistics
  Mathematical Statistics: statistics
  Bayesian Statistics: statistics
  Time Series Analysis: statistics
  Analysis of PDEs: analysis
  PDEs on Graphs: analysis
  Functional Analysis: analysis
  ODEs: analysis
  Dynamical Systems: analysis
  Differential Topology & Geometry: geometry
  Differential Geometry: geometry
  Numerical Analysis: numerics
  General Relativity: physics
  Quantum Mechanics: physics
  Astrophysics: physics
  Fluid Dynamics: physics
